name: Daily Activity + Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  # ── Job 1: Daily commit ──
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name "HimanshuSingh-966"
          git config --global user.email "himanshu.singh.2kfive@gmail.com"

      - name: Append to activity log
        run: |
          mkdir -p activity
          QUOTES=(
            "Build something people want."
            "First, solve the problem. Then, write the code."
            "The best way to predict the future is to invent it."
            "Simplicity is the soul of efficiency."
            "Make it work, make it right, make it fast."
            "Data is the new oil — refine it well."
            "Without data, you are just another person with an opinion."
            "The goal is to turn data into information, and information into insight."
            "It always seems impossible until it is done."
            "Code is like humor. When you have to explain it, it's bad."
          )
          QUOTE=${QUOTES[$RANDOM % ${#QUOTES[@]}]}
          echo "[$(date -u +"%Y-%m-%d %H:%M UTC")] — $QUOTE" >> activity/log.txt

      - name: Commit and push
        run: |
          git add activity/log.txt
          if git diff --cached --quiet; then
            echo "Nothing to commit, skipping"
          else
            git commit -m "🤖 Daily log — $(date -u +"%Y-%m-%d") [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

  # ── Job 2: Snake ──
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate Snake Animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "🐍 Update snake [skip ci]"
