name: Daily Activity + Snake + Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  # ── Job 1: Daily commit ──
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name "HimanshuSingh-966"
          git config --global user.email "himanshu.singh.2kfive@gmail.com"

      - name: Create daily log file
        run: |
          mkdir -p activity
          QUOTES=(
            "Build something people want."
            "First, solve the problem. Then, write the code."
            "The best way to predict the future is to invent it."
            "Simplicity is the soul of efficiency."
            "Make it work, make it right, make it fast."
            "Data is the new oil — refine it well."
            "Without data, you are just another person with an opinion."
            "The goal is to turn data into information, and information into insight."
            "It always seems impossible until it is done."
            "Code is like humor. When you have to explain it, it's bad."
          )
          QUOTE=${QUOTES[$RANDOM % ${#QUOTES[@]}]}
          FILENAME="activity/$(date -u +"%Y-%m-%d_%H-%M-%S").txt"
          echo "[$(date -u +"%Y-%m-%d %H:%M UTC")] — $QUOTE" > "$FILENAME"

      - name: Commit and push
        run: |
          git add activity/
          if git diff --cached --quiet; then
            echo "Nothing to commit, skipping"
          else
            git commit -m "🤖 Daily log — $(date -u +"%Y-%m-%d") [skip ci]"
            git push origin main
          fi

  # ── Job 2: Snake ──
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate Snake Animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Snake to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          keep_files: true
          commit_message: "🐍 Update snake [skip ci]"

  # ── Job 3: Generate Stats Cards ──
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout output branch
        uses: actions/checkout@v3
        with:
          ref: output
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Generate Stats SVGs
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PAT_TOKEN }}
          user: HimanshuSingh-966
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          filename: stats.svg
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          config_output: svg
          config_display: large

      - name: Generate Langs SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PAT_TOKEN }}
          user: HimanshuSingh-966
          template: classic
          base: ""
          filename: langs.svg
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          config_output: svg

      - name: Push Stats to Output Branch
        run: |
          git config user.name "HimanshuSingh-966"
          git config user.email "himanshu.singh.2kfive@gmail.com"
          git add stats.svg langs.svg || true
          git diff --cached --quiet || git commit -m "📊 Update stats [skip ci]"
          git push origin output
